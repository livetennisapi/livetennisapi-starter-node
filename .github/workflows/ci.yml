name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/truthcheck.sh   # product facts stay current
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # the documented floor
      - run: npm install
      - run: npm test          # node --test, no network
